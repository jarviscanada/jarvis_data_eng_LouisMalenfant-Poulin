summary: "Je suis Louis Malenfant-Poulin, un récent diplômé en informatique de l'Université de Montréal. Mon expérience dans des compétitions comme l'ICPC m'a permis d'en apprendre beaucoup plus sur les algorithmes et l'optimisation. Cette compétition m'a aussi permis de m'entraîner au travail d'équipe sous pression, car résoudre plusieurs problèmes de programmation très difficiles en très peu de temps avec deux autres personnes demandait beaucoup de coopération. J'ai aussi animé un club de cybersécurité où j'ai appris à enseigner et à diriger d'autres personnes dans des compétitions dans un domaine où la compréhension est toujours plus importante que la connaissance. Enfin, je participe toujours à des événements en informatique comme l'avènement du code, où je peux continuer à m'entraîner en Python, C, C++ et bien d'autres langages."
