# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/scripts"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Implemented a Cluster monitoring program that allows the user to see information on their machine's statistics and stores them. This project also allows the user to obtain information on their computer's usage, such as memory free, I/O and more by setting up a cronjob that looks it up every minute. This project used shell commands through shell files that called for the execution of information gathering functions such as lscpu and stored them in a sql database."

# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
    #project name
  - name: "Complex raytracer"
    #URL is optional
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Created a functionning raytracer that rendered images with both precision and speed. This raytracer was implemented in C++ and used OpenGL. It implemented various types of collisions and refrations with a variety of surfaces. Optimization was done through AABBs that helped speed up the raytracing by minimising the checks. This raytracer was also able to simulate collisions with different types of surfaces such as liquids and smoke. "
  - name: "Machine learning project"
    description: "Developped a machine learning model that could take as input information about a building and predict climatisation usage throughout. This project involved the use of lstm as the information was sorted through time and the loss of order would have rendered the data unreliable. This project also involved gathering and treating large datasets such as normalizing some datapoints and transforming times so that they would be perceived as circular by the program."

